services:
  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: "postgres:18.1-bookworm"
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # postgres 18+: монтируем /var/lib/postgresql (данные лягут в 18/docker), не /data
      - postgres_data:/var/lib/postgresql
      - ./pg_backups:/pgadmin/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15

  socat:
    image: alpine/socat:1.8.0.3
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  adminer: # Легче, чем pgAdmin!
    image: adminer
    restart: "no"
    ports:
      - "${ADMINER_PORT}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette # Красивая тема
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
